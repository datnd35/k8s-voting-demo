# ============================================================
# RESULT SERVER SERVICE
# Mục đích: Tạo stable network endpoint nội bộ cho result-server.
# Sau khi thêm Ingress, service này KHÔNG expose trực tiếp ra ngoài.
# Ingress Controller sẽ route traffic từ results.local vào đây.
# ============================================================

# apiVersion: v1 — Service thuộc core API group.
apiVersion: v1

# kind: Service — tạo stable endpoint cho result-server Pods.
kind: Service

metadata:
  # name: "result-server" — DNS hostname nội bộ của Service.
  # Ingress rule sẽ forward traffic đến "result-server:3001".
  name: result-server

  labels:
    app: result-server

spec:
  # selector: Service forward traffic đến Pod có label app=result-server.
  selector:
    app: result-server

  ports:
    - # name: Tên cho port mapping.
      name: http

      # port: Port Service lắng nghe (Ingress gọi vào đây).
      port: 3001

      # targetPort: Port trên Pod nhận traffic.
      # Phải khớp containerPort: 3001 trong result-server-deployment.yaml.
      targetPort: 3001

  # type: ClusterIP — chỉ accessible bên trong cluster.
  # Ingress Controller (trong cluster) sẽ forward traffic vào đây.
  # Bên ngoài cluster không thể gọi trực tiếp result-server — phải qua Ingress.
  type: ClusterIP
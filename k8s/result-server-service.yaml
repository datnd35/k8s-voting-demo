# ============================================================
# RESULT SERVER SERVICE
# Mục đích: Expose result-server ra ngoài cluster để browser
# có thể truy cập trang hiển thị kết quả vote.
# Load balance traffic giữa các Pod replicas.
# ============================================================

# apiVersion: v1 — Service thuộc core API group.
apiVersion: v1

# kind: Service — tạo stable endpoint cho result-server Pods.
kind: Service

metadata:
  # name: "result-server" — DNS hostname nội bộ của Service.
  # Pod khác trong cluster có thể gọi "result-server:3001".
  name: result-server

  labels:
    app: result-server

spec:
  # selector: Service forward traffic đến Pod có label app=result-server.
  # Khi scale up/down, Service tự thêm/bớt Pod vào pool không cần config lại.
  selector:
    app: result-server

  ports:
    - # name: Tên cho port mapping (giúp debug dễ hơn).
      name: http

      # port: Port Service lắng nghe từ bên ngoài.
      # Truy cập: http://localhost:3001 sau khi Docker Desktop expose ra host.
      port: 3001

      # targetPort: Port trên Pod nhận traffic từ Service.
      # Phải khớp với containerPort: 3001 trong result-server-deployment.yaml.
      targetPort: 3001

  # type: LoadBalancer — expose Service ra ngoài cluster.
  # Docker Desktop tự map port 3001 ra localhost Mac.
  # → Mở http://localhost:3001 trực tiếp trên browser để xem kết quả vote.
  # Khác với redis-service dùng ClusterIP vì Redis không cần expose ra ngoài.
  type: LoadBalancer
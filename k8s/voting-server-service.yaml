# ============================================================
# VOTING SERVER SERVICE
# Mục đích: Tạo stable network endpoint nội bộ cho voting-server.
# Sau khi thêm Ingress, service này KHÔNG cần expose ra ngoài nữa.
# Ingress Controller sẽ là entry point duy nhất từ bên ngoài cluster.
# ============================================================

# apiVersion: v1 — Service thuộc core API group.
apiVersion: v1

# kind: Service — tạo stable endpoint cho voting-server Pods.
kind: Service

metadata:
  # name: "voting-server" — tên Service, cũng là DNS hostname nội bộ.
  # Ingress sẽ forward traffic đến "voting-server:3000" qua tên này.
  name: voting-server

  labels:
    app: voting-server

spec:
  # selector: Service tìm các Pod có label app=voting-server để forward traffic.
  # Khi Pod mới được tạo (scale up), Service tự thêm Pod đó vào pool.
  # Khi Pod bị xoá (scale down), Service tự loại khỏi pool.
  selector:
    app: voting-server

  ports:
    - # name: Nhãn cho port.
      name: http

      # port: Port Service lắng nghe (Ingress gọi vào đây).
      port: 3000

      # targetPort: Port trên Pod mà Service forward traffic vào.
      # Phải khớp với containerPort: 3000 trong voting-server-deployment.yaml.
      targetPort: 3000

  # type: ClusterIP — Service chỉ accessible bên trong cluster.
  # Đây là THAY ĐỔI so với LoadBalancer:
  # - Trước: mỗi service tự expose ra ngoài → cần nhiều external port.
  # - Sau:  Ingress là single entry point → tất cả traffic đi qua 1 chỗ.
  # ClusterIP an toàn hơn vì voting-server không bị expose trực tiếp ra internet.
  type: ClusterIP